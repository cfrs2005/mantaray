# DNS 出口绑定（DNS Pinning）— 单一真源
#
# 这个文件是 configs/*.conf 中 PINNING 区块的唯一来源。
# 不要直接改 configs/*.conf 里的 PINNING 区块 —— 改这里，然后跑:
#
#   python3 scripts/sync.py && python3 scripts/verify.py
#
# ============================================================
# 这个文件是公开的
# ============================================================
#
# 仓库公开 + [Host] 只能内联 = 写进这里的东西等于公开发布。
# 所以这里只放公开可查的域名（案例、通用服务），个人基础设施一律走私有层：
#
#   机场 / 订阅域名、内网 IP 与网段、自建 VPS 裸 IP、未公开的内部服务域名
#   -> dns/pinning.local.conf（已 gitignore），sync 合并进 configs/local/
#
# 判据很简单：这条信息公开出去，会不会给别人多一个打你的入口。
#
# ============================================================
# 为什么需要这一层
# ============================================================
#
# Shadowrocket 里「走哪个出口」和「用哪个 DNS 解析」是两条独立决策链。
# 一个域名的正确性取决于这两者是否配对：
#
#   出口      解析源                    结果
#   DIRECT    本地国内 DNS              ✅
#   DIRECT    静态 [Host] IP            ✅ 零 DNS 依赖，最硬
#   DIRECT    海外 DNS                  ❌ 海外 IP 走国内出口，慢/超时
#   PROXY     落地节点解析(remote DNS)   ✅
#   PROXY     本地 DNS                  ❌ 国内 IP 走海外出口，绕地球
#
# 由此得到全项目唯一一条 DNS 铁律：
#
#   >> 只给 DIRECT 出口的域名做 DNS 绑定。
#   >> 走 PROXY 的域名一个字都不要写进 [Host]，也不要放进 always-real-ip ——
#   >> 让 Shadowrocket 把域名原样交给落地节点解析。
#
# 这条规则消除了「按域名逐个判断该用哪个 DNS」的分支，
# 出口策略一旦确定，解析源就唯一确定。
#
# ============================================================
# 三层解析优先级（对 DNS 的依赖从弱到强）
# ============================================================
#
#   L0  静态 Host      domain = 1.2.3.4                零 DNS 依赖。内网服务 / DNS 不可信
#   L1  域名级绑定      domain = server:https://...     强制解析源。DIRECT 但全局 DNS 不可信
#   L2  全局 dns-server  [General] dns-server            兜底
#   L3  落地解析        （不写任何东西）                  PROXY 域名走这条
#
# L0 默认注释关闭：静态 IP 最硬也最脆，对端换 IP 就断。
# 只在「L1 已经证明不够用」时逐条打开，并在注释里记下实测日期。
#
# ============================================================
# [Host] 语法三个必踩的坑
# ============================================================
#
#   1. 域名与 = 之间不能有空格。`*. example.com = ...` 整条静默失效。
#   2. 通配不匹配裸域。`*.example.com` 不覆盖 `example.com`，两条都要写。
#   3. 按书写顺序匹配，先命中先生效。具体域名必须写在通配之前。
#
# 这三条 scripts/verify.py 都有断言守着，别靠记。


