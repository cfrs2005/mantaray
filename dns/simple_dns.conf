# 简单 DNS 配置
# 双 DoH，适合日常使用
#
# 用法: 复制到主配置 [General] 段的 dns-server 字段

dns-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query

# 说明:
#   doh.pub        - 腾讯 DNSPod DoH
#   dns.alidns.com - 阿里 DNS DoH
#
# 双源可互为备份，解析结果基本一致
# 如遇解析异常，可临时切换为 strict_dns.conf 中的单源方案
#
# ------------------------------------------------------------
# 这一层只是兜底（L2）
# ------------------------------------------------------------
# dns-server 是一个全局值，而不同域名需要不同解析源 —— 它解决不了
# 「这个域名就该走 doh.pub、那个域名必须交给落地节点」这类需求。
#
# 逐域名的解析源绑定在 dns/pinning.conf（L0/L1），见 docs/dns-pinning.md。
