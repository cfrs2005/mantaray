# DNS 出口绑定 — 本地私有层（示例）
#
# 复制成 dns/pinning.local.conf 后填自己的东西。该文件已被 .gitignore，
# 不会进公开仓库。scripts/sync.py 会把它追加在 dns/pinning.conf 之后，
# 生成到 configs/local/ 下的私有配置。
#
# ============================================================
# 为什么要分这一层
# ============================================================
#
# 本仓库是公开的（github.com/cfrs2005/mantaray），而 [Host] 段不支持
# RULE-SET 远程加载，只能内联进 conf。两件事一撞，就有了这个约束：
#
#   >> 写进 configs/*.conf 的东西 = 公开发布。
#
# 以下内容属于「不该公开」，一律放本层：
#   - 机场 / 订阅域名        公开索引会加速被封
#   - 内网 IP 与网段          暴露公司内网拓扑
#   - 自建 VPS 的裸 IP        暴露个人基础设施
#   - 未公开的内部服务域名     暴露服务命名与边界
#
# 分发方式见 docs/dns-pinning.md「三种分发」一节。


# ==== MANTARAY-PINNING-RULE-BEGIN ====
# --- 本地私有出口规则 ---

# 内网网段 —— 显式声明优先于 GeoIP，no-resolve 避免触发解析
# IP-CIDR,10.x.x.0/24,DIRECT,no-resolve

# 走代理的私有子域（更具体，必须写在同域通配之前）
# DOMAIN-SUFFIX,intake.example-vendor.com,PROXY,extended-matching

# 直连的私有域
# DOMAIN-SUFFIX,internal.example.com,DIRECT
# ==== MANTARAY-PINNING-RULE-END ====


# ==== MANTARAY-PINNING-HOST-BEGIN ====
# --- 本地私有 DNS 绑定 ---

# L1 域名级绑定：DIRECT 出口 + 强制国内 DoH
# 通配不匹配裸域，两条都要写；域名与 = 之间不能有空格
# internal.example.com = server:https://doh.pub/dns-query
# *.internal.example.com = server:https://doh.pub/dns-query

# L0 静态 Host：零 DNS 依赖，用于 split-horizon 内网服务
# 打开前先实测，并在注释里记下 IP 来源和日期；对端换 IP 就会断
# intranet.example.com = 10.0.0.1
# *.intranet.example.com = 10.0.0.1
# ==== MANTARAY-PINNING-HOST-END ====
